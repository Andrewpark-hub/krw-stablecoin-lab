[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# 다른 레포(금괴 보관증 NFT)랑 같은 설정: Remix 0.8.31, EVM osaka
solc = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts@5.1.0/=lib/openzeppelin-contracts/contracts/",
]

[lint]
lint_on_build = false
